name: AWS Deployment Pipeline

on:
  push:
    branches: [main, develop, feature/backend-api]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ca-west-1' }}
  PROJECT_NAME: medi-aide

jobs:
  # ============================================================================
  # BUILD AND PUSH TO ECR
  # ============================================================================
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - notification-service
          - auth-service
          - user-service
          - visit-service
          - wellness-service
          - payment-service
          - search-service
          - audit-service
          - matching-service
          - evv-service
          - care-plan-service
          - file-service
          - training-service
          - feedback-service
          - communication-service
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          repository="${PROJECT_NAME}/${{ matrix.service }}"
          if ! aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$repository" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          fi

      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile.pnpm
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:latest
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # DEPLOY TO STAGING (ECS)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/backend-api' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.medi-aide.ca
    env:
      DEPLOY_ENV: staging
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_STAGING || vars.ECS_CLUSTER_STAGING || secrets.ECS_CLUSTER || vars.ECS_CLUSTER || 'medi-aide-staging' }}
      ECS_SERVICE_PREFIX: ${{ vars.ECS_SERVICE_PREFIX_STAGING || vars.ECS_SERVICE_PREFIX || 'medi-aide' }}
      ECS_SERVICE_MAP: ${{ secrets.ECS_SERVICE_MAP_STAGING || vars.ECS_SERVICE_MAP_STAGING || secrets.ECS_SERVICE_MAP || vars.ECS_SERVICE_MAP || '{}' }}
      ECS_DEPLOY_REQUIRE_ALL: ${{ vars.ECS_DEPLOY_REQUIRE_ALL || 'true' }}
      IMAGE_TAG: ${{ github.sha }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR registry
        id: ecr
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Deploy services to staging ECS
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          bash scripts/deploy-ecs-services.sh \
            notification-service \
            auth-service \
            user-service \
            visit-service \
            wellness-service \
            payment-service \
            search-service \
            audit-service \
            matching-service \
            evv-service \
            care-plan-service \
            file-service \
            training-service \
            feedback-service \
            communication-service

  # ============================================================================
  # DEPLOY TO PRODUCTION (ECS)
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://medi-aide.com
    env:
      DEPLOY_ENV: production
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_PRODUCTION || vars.ECS_CLUSTER_PRODUCTION || secrets.ECS_CLUSTER || vars.ECS_CLUSTER || 'medi-aide-production' }}
      ECS_SERVICE_PREFIX: ${{ vars.ECS_SERVICE_PREFIX_PRODUCTION || vars.ECS_SERVICE_PREFIX || 'medi-aide' }}
      ECS_SERVICE_MAP: ${{ secrets.ECS_SERVICE_MAP_PRODUCTION || vars.ECS_SERVICE_MAP_PRODUCTION || secrets.ECS_SERVICE_MAP || vars.ECS_SERVICE_MAP || '{}' }}
      ECS_DEPLOY_REQUIRE_ALL: ${{ vars.ECS_DEPLOY_REQUIRE_ALL || 'true' }}
      IMAGE_TAG: ${{ github.sha }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR registry
        id: ecr
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Deploy services to production ECS
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          bash scripts/deploy-ecs-services.sh \
            notification-service \
            auth-service \
            user-service \
            visit-service \
            wellness-service \
            payment-service \
            search-service \
            audit-service \
            matching-service \
            evv-service \
            care-plan-service \
            file-service \
            training-service \
            feedback-service \
            communication-service

      - name: Notify deployment success
        if: success()
        run: |
          echo "Production ECS deployment completed successfully"
          echo "Services deployed: notification, auth, user, visit, wellness, payment, search, audit, matching, evv, care-plan, file, training, feedback, communication"
