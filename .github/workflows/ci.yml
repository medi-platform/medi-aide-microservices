name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install pnpm
        run: npm i -g pnpm@9
      - name: Install deps
        run: pnpm install --frozen-lockfile=false
      - name: Lint
        run: pnpm -r run lint || true
      - name: Build packages
        run: pnpm -r --filter './packages/*' run build
      - name: Build services (tsc)
        run: |
          for svc in services/*; do
            if [ -f "$svc/tsconfig.json" ]; then
              (cd "$svc" && npx tsc)
            fi
          done
      - name: Unit tests
        run: pnpm -r test || true
