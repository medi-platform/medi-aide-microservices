##############################################################################
# Deploy Single Service Workflow
# Phase 8: CI/CD Pipeline Enhancements
#
# Allows deploying a single service to any environment
##############################################################################

name: Deploy Single Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - auth-service
          - user-service
          - agency-service
          - caregiver-service
          - patient-service
          - scheduling-service
          - residential-service
          - visit-service
          - evv-service
          - care-plan-service
          - care-request-service
          - contract-service
          - payment-service
          - notification-service
          - communication-service
          - feedback-service
          - training-service
          - wellness-service
          - mentorship-service
          - incident-service
          - reports-service
          - matching-service
          - search-service
          - file-service
          - audit-service
          - ai-ml-service
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ca-west-1' }}
  PROJECT_NAME: medi-aide

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      ECS_CLUSTER: ${{ inputs.environment == 'production' && (secrets.ECS_CLUSTER_PRODUCTION || vars.ECS_CLUSTER_PRODUCTION || secrets.ECS_CLUSTER || vars.ECS_CLUSTER || 'medi-aide-production') || inputs.environment == 'staging' && (secrets.ECS_CLUSTER_STAGING || vars.ECS_CLUSTER_STAGING || secrets.ECS_CLUSTER || vars.ECS_CLUSTER || 'medi-aide-staging') || secrets.ECS_CLUSTER || vars.ECS_CLUSTER || 'medi-aide-development' }}
      ECS_SERVICE_PREFIX: ${{ inputs.environment == 'production' && (vars.ECS_SERVICE_PREFIX_PRODUCTION || vars.ECS_SERVICE_PREFIX) || inputs.environment == 'staging' && (vars.ECS_SERVICE_PREFIX_STAGING || vars.ECS_SERVICE_PREFIX) || vars.ECS_SERVICE_PREFIX || 'medi-aide' }}
      ECS_SERVICE_MAP: ${{ inputs.environment == 'production' && (secrets.ECS_SERVICE_MAP_PRODUCTION || vars.ECS_SERVICE_MAP_PRODUCTION) || inputs.environment == 'staging' && (secrets.ECS_SERVICE_MAP_STAGING || vars.ECS_SERVICE_MAP_STAGING) || secrets.ECS_SERVICE_MAP || vars.ECS_SERVICE_MAP || '{}' }}
      ECS_DEPLOY_REQUIRE_ALL: "true"
      IMAGE_TAG: ${{ inputs.image_tag }}
      AWS_ROLE_TO_ASSUME: ${{ inputs.environment == 'production' && (secrets.AWS_ROLE_TO_ASSUME_PRODUCTION || secrets.AWS_ROLE_TO_ASSUME || '') || inputs.environment == 'staging' && (secrets.AWS_ROLE_TO_ASSUME_STAGING || secrets.AWS_ROLE_TO_ASSUME || '') || secrets.AWS_ROLE_TO_ASSUME || '' }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.environment == 'production' && (secrets.AWS_ACCOUNT_ID_PRODUCTION || vars.AWS_ACCOUNT_ID_PRODUCTION || '') || inputs.environment == 'staging' && (secrets.AWS_ACCOUNT_ID_STAGING || vars.AWS_ACCOUNT_ID_STAGING || '946769779647') || secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (static keys)
        if: env.AWS_ROLE_TO_ASSUME == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ -n "${EXPECTED_AWS_ACCOUNT_ID:-}" && "$actual_account" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::AWS credentials resolved to account ${actual_account}, expected ${EXPECTED_AWS_ACCOUNT_ID}."
            exit 1
          fi

      - name: Resolve ECR registry
        id: ecr
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Deploy service to ECS
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          bash scripts/deploy-ecs-services.sh "${{ inputs.service }}"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} ${{ inputs.service }} deployed to ${{ inputs.environment }} by ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
