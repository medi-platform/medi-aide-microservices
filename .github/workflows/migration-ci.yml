name: Migration & Integration CI

on:
  push:
    paths:
      - 'packages/migration-tools/**'
      - 'packages/domain-events/**'
      - 'tools/reconciliation-worker/**'
      - '.github/workflows/migration-ci.yml'
  pull_request:
    paths:
      - 'packages/migration-tools/**'
      - 'packages/domain-events/**'
      - 'tools/reconciliation-worker/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Enable corepack
        run: corepack enable && corepack prepare pnpm@8.15.0 --activate
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build migration-tools
        run: pnpm --filter ./packages/migration-tools build
      - name: Build domain-events
        run: pnpm --filter ./packages/domain-events build
      - name: Build reconciliation-worker
        run: pnpm --filter ./tools/reconciliation-worker build



