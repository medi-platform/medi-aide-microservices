name: Build Single Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build'
        required: true
        type: choice
        options:
          - notification-service
          - auth-service
          - user-service
          - visit-service
          - wellness-service
          - payment-service
          - search-service
          - audit-service
          - matching-service
          - evv-service
          - care-plan-service
          - file-service
          - training-service
          - feedback-service
          - communication-service
          - care-request-service
          - scheduling-service
          - agency-service
          - caregiver-service
          - patient-service
          - ai-ml-service
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build and Deploy ${{ inputs.service }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Dockerfile
        id: dockerfile
        run: |
          if [ "${{ inputs.service }}" == "ai-ml-service" ]; then
            echo "path=services/ai-ml-service/Dockerfile" >> $GITHUB_OUTPUT
            echo "context=./services/ai-ml-service" >> $GITHUB_OUTPUT
          else
            echo "path=services/${{ inputs.service }}/Dockerfile.pnpm" >> $GITHUB_OUTPUT
            echo "context=." >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.dockerfile.outputs.context }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ inputs.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ inputs.service }}:${{ inputs.environment }}
          build-args: |
            SERVICE_NAME=${{ inputs.service }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to environment
        run: |
          echo "Deploying ${{ inputs.service }} to ${{ inputs.environment }}..."
          # Add deployment logic here

