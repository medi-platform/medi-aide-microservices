# Patient Service Values
nameOverride: "patient-service"
fullnameOverride: "patient-service"

image:
  repository: ghcr.io/medi-aide/patient-service
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 4003

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: SERVICE_NAME
    value: "patient-service"
  - name: SERVICE_PORT
    value: "4003"

extraEnvFrom:
  - secretRef:
      name: patient-service-secrets
  - configMapRef:
      name: common-config

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
