# Production Environment Values
# Phase 8: CI/CD Pipeline Enhancements

# Environment
environment: production

# Image configuration
image:
  repository: ghcr.io/medi-aide/placeholder
  tag: "latest"
  pullPolicy: IfNotPresent

# Production replicas
replicaCount: 3

# Production resources
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

# HPA for production
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# PDB for high availability
pdb:
  enabled: true
  minAvailable: 2

# Ingress for production
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "500"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.medi-aide.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: production-tls
      hosts:
        - api.medi-aide.com

# Strict network policies
networkPolicy:
  enabled: true
  allowNamespaceSelectors:
    - matchLabels:
        name: medi-aide-prod

# Pod security context (production-hardened)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Service monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 5s
  path: /metrics

# Environment variables
env:
  - name: NODE_ENV
    value: production
  - name: LOG_LEVEL
    value: info
  - name: SERVICE_PORT
    value: "4010"

# External secrets from AWS Secrets Manager
extraEnvFrom:
  - secretRef:
      name: production-secrets
  - configMapRef:
      name: production-config

# Production probes (strict timing)
livenessProbe:
  path: /ping
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 3

# Anti-affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: "{{ .Release.Name }}"
          topologyKey: kubernetes.io/hostname

# Topology spread constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: "{{ .Release.Name }}"

# Canary deployment support
canary:
  enabled: false
  weight: 0
