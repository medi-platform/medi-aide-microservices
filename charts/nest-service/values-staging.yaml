# Staging Environment Values
# Phase 8: CI/CD Pipeline Enhancements

# Environment
environment: staging

# Image configuration
image:
  repository: ghcr.io/medi-aide/placeholder
  tag: "latest"
  pullPolicy: Always

# Replicas for staging
replicaCount: 2

# Resources for staging (lower than production)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# HPA for staging
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# PDB
pdb:
  enabled: true
  minAvailable: 1

# Ingress for staging
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: staging-api.medi-aide.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: staging-tls
      hosts:
        - staging-api.medi-aide.com

# Network policies
networkPolicy:
  enabled: true
  allowNamespaceSelectors:
    - matchLabels:
        name: medi-aide-staging

# Service monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics

# Environment variables
env:
  - name: NODE_ENV
    value: staging
  - name: LOG_LEVEL
    value: debug
  - name: SERVICE_PORT
    value: "4010"

# External secrets
extraEnvFrom:
  - secretRef:
      name: staging-secrets
  - configMapRef:
      name: staging-config

# Probes with relaxed timing for staging
livenessProbe:
  path: /ping
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5

readinessProbe:
  path: /health
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
