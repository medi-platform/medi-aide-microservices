version: "3.9"

services:
  verdaccio:
    image: verdaccio/verdaccio:5
    ports: 
      - "4873:4873"
    volumes:
      - verdaccio-storage:/verdaccio/storage
      - verdaccio-conf:/verdaccio/conf
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:4873/-/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - medi-aide-backend
    environment:
      - VERDACCIO_PUBLIC_URL=http://localhost:4873/

volumes:
  verdaccio-storage:
  verdaccio-conf:

networks:
  medi-aide-backend:
    external: true

