

# Compose override: remap Kong host ports via environment variables
# Keeps container internal ports at defaults; only host binding changes.

services:
  kong:
    ports:
      - "${KONG_HTTP_PORT:-28000}:8000"   # proxy (HTTP)
      - "${KONG_HTTPS_PORT:-28443}:8443"  # proxy (HTTPS)
      - "${KONG_ADMIN_PORT:-28001}:8001"  # admin API (dev only)
    environment:
      # Expose admin API to host for local dev tools/scripts
      KONG_ADMIN_LISTEN: 0.0.0.0:8001