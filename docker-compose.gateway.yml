version: "3.9"

services:
  kong-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - kong-pg:/var/lib/postgresql/data
    # expose only if you want external tools to reach DB locally:
    # ports: ["5433:5432"]

  kong-migrations:
    image: kong:3.6
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    command: ["kong", "migrations", "bootstrap"]
    restart: "no"

  kong:
    image: kong:3.6
    depends_on:
      kong-db:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      # Ensure Kong resolves Docker service names via Docker's embedded DNS
      KONG_DNS_RESOLVER: 127.0.0.11
      KONG_DNS_ORDER: LAST,SRV,A,CNAME
      # Listen on all interfaces and ensure the host can bind the ports
      KONG_PROXY_LISTEN: 0.0.0.0:8000 reuseport backlog=16384, 0.0.0.0:8443 ssl reuseport backlog=16384
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      # Optional: log to stdout for docker logs
      KONG_LOG_LEVEL: notice
    ports:
      - "28000:8000"   # proxy (HTTP)
      - "28443:8443"   # proxy (HTTPS)
      - "28001:8001"   # admin API (lock down in prod!)
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    networks:
      - default
      - stage3-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional: apply declarative config after Kong is healthy
  kong-deck:
    image: kong/deck:latest
    depends_on:
      kong:
        condition: service_healthy
    environment:
      DECK_KONG_ADDR: http://kong:8001
    volumes:
      - ./gateway:/workspace:ro   # put kong.yaml here if you use decK
    command: ["sync", "-s", "/workspace/kong.yaml"]
    restart: "no"

volumes:
  kong-pg:

networks:
  stage3-network:
    external: true