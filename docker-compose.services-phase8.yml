version: '3.8'

networks:
  stage3-network:
    external: true
    name: stage3-network

services:
  analytics-service:
    build:
      context: ./services/analytics-service
    container_name: stage3-analytics-service
    environment:
      - NODE_ENV=development
      - PORT=4016
      - DB_HOST=stage3-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=analytics_db
    ports:
      - "4016:4016"
    depends_on:
      - stage3-postgres
    networks:
      - stage3-network

  audit-service:
