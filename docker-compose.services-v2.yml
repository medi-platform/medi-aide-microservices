      - medi-aide-oss-network
    restart: unless-stopped

  incident-service:
    build:
      context: .
      dockerfile: services/incident-service/Dockerfile.pnpm
      args:
        SERVICE_NAME: incident-service
    container_name: stage3-incident-service
    environment:
      <<: *common-env
      SERVICE_NAME: incident-service
      SERVICE_VERSION: 1.0.0
      SERVICE_PORT: 4056
      DB_DATABASE: incident_db
      DATABASE_NAME: incident_db
    ports:
      - "4056:4056"
    healthcheck:
      <<: *default-healthcheck
    networks:
      - stage3-network
      - medi-aide-oss-network
    restart: unless-stopped

  insurance-service:
    build:
      context: .
      dockerfile: services/insurance-service/Dockerfile.pnpm
      args:
        SERVICE_NAME: insurance-service
    container_name: stage3-insurance-service
    environment:
      <<: *common-env
      SERVICE_NAME: insurance-service
      SERVICE_VERSION: 1.0.0
      SERVICE_PORT: 4057
      DB_DATABASE: insurance_db
      DATABASE_NAME: insurance_db
    ports:
      - "4057:4057"
    healthcheck:
      <<: *default-healthcheck
    networks:
      - stage3-network
      - medi-aide-oss-network
    restart: unless-stopped

  # ============================================
  # TEMPORAL WORKER (Phase 2)
  # ============================================
  
  temporal-worker:
    build:
      context: .
      dockerfile: services/temporal-worker/Dockerfile
    container_name: stage3-temporal-worker
    environment:
      <<: *common-env
      TEMPORAL_TASK_QUEUE: medi-aide-care-workflows
      TEMPORAL_NAMESPACE: default
      METRICS_PORT: 9000
      HEALTH_PORT: 8080
      # Service JWT for inter-service communication
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-medi-aide-service-jwt-secret}
    ports:
      - "9200:9000"  # Metrics
      - "8280:8080"  # Health
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - stage3-network
      - medi-aide-oss-network
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  ai-ml-models:
    driver: local
  ai-ml-logs:
    driver: local

