# Stage Three Microservices - Corrected Configuration
# Uses existing medi-aide-oss infrastructure

x-common-env: &common-env
  NODE_ENV: development
  DB_HOST: medi-aide-oss-postgres-1
  DB_PORT: 5432
  DB_USER: service_user
  DB_USERNAME: service_user
  DB_PASSWORD: service123
  REDIS_HOST: medi-aide-oss-redis-1
  REDIS_PORT: 6379
  KAFKA_BROKERS: medi-aide-oss-kafka-1:9092
  TEMPORAL_ADDRESS: medi-aide-oss-temporal-1:7233
  CONSUL_HOST: stage3-consul
  CONSUL_PORT: 8500
  JAEGER_ENDPOINT: http://stage3-jaeger:14268/api/traces
  DISABLE_CONSUL: "true"
  DISABLE_MQ: "true"

x-healthcheck: &default-healthcheck
  test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${SERVICE_PORT:-4010}/ping',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

networks:
  stage3-network:
    external: true
  medi-aide-oss-network:
    external: true

services:
  # ============================================
  # CORE SERVICES
  # ============================================
  
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile.pnpm
      args:
        SERVICE_NAME: notification-service
    container_name: stage3-notification-service
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      SERVICE_VERSION: 1.0.0
      SERVICE_PORT: 4010
      DB_DATABASE: notification_db
      DATABASE_NAME: notification_db
    ports:
      - "4010:4010"
    healthcheck:
      <<: *default-healthcheck
    networks:
      - stage3-network
      - medi-aide-oss-network
    restart: unless-stopped

