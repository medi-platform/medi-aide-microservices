# Stage Three Microservices - Corrected Configuration
# Uses existing medi-aide-oss infrastructure

x-common-env: &common-env
  NODE_ENV: development
  DB_HOST: medi-aide-oss-postgres-1
  DB_PORT: 5432
  DB_USER: service_user
  DB_USERNAME: service_user
  DB_PASSWORD: service123
  REDIS_HOST: medi-aide-oss-redis-1
  REDIS_PORT: 6379
  KAFKA_BROKERS: medi-aide-oss-kafka-1:9092
  TEMPORAL_ADDRESS: medi-aide-oss-temporal-1:7233
  TEMPORAL_NAMESPACE: default
  CONSUL_HOST: stage3-consul
  CONSUL_PORT: 8500
  JAEGER_ENDPOINT: http://stage3-jaeger:14268/api/traces
  DISABLE_CONSUL: "true"
  DISABLE_GRPC: "true"
  DISABLE_MQ: "true"
  # Phase 2: Service-to-Service JWT Auth
  SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-medi-aide-service-jwt-secret-change-in-production}
  # Phase 2: Kafka configuration
  KAFKA_GROUP_ID_SUFFIX: -group
  KAFKA_DLQ_ENABLED: "true"

x-healthcheck: &default-healthcheck
  test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${SERVICE_PORT:-4010}/ping',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

networks:
  stage3-network:
    external: true
  medi-aide-oss-network:
    external: true

