  # ============================================
  # AI/ML SERVICE (Python/FastAPI)
  # ============================================
  
  ai-ml-service:
    build:
      context: ./services/ai-ml-service
      dockerfile: Dockerfile
      target: production
    container_name: stage3-ai-ml-service
    environment:
      # Application
      APP_NAME: Medi-Aide AI/ML Service
      APP_VERSION: 1.0.0
      ENVIRONMENT: development
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8005
      WORKERS: 2
      
      # Database
      DB_HOST: medi-aide-oss-postgres-1
      DB_PORT: 5432
      DB_USER: service_user
      DB_PASSWORD: service123
      DB_NAME: ai_db
      
      # Redis
      REDIS_HOST: medi-aide-oss-redis-1
      REDIS_PORT: 6379
      
      # Kafka
      KAFKA_BROKERS: medi-aide-oss-kafka-1:9092
      
      # Consul
      CONSUL_HOST: stage3-consul
      CONSUL_PORT: 8500
      CONSUL_ENABLED: "true"
      
      # Observability
      JAEGER_AGENT_HOST: stage3-jaeger
      JAEGER_AGENT_PORT: 6831
      JAEGER_ENDPOINT: http://stage3-jaeger:14268/api/traces
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      METRICS_ENABLED: "true"
      
      # AI Settings
      AI_MATCHING_MIN_SCORE: 0.3
      AI_MATCHING_MAX_RESULTS: 20
      AI_ENABLE_CULTURAL_MATCHING: "true"
      AI_ENABLE_EXPLAINABILITY: "true"
      AI_BURNOUT_HIGH_RISK_THRESHOLD: 0.7
      AI_SCHEDULE_MAX_TRAVEL_MINUTES: 45
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - stage3-network
      - medi-aide-oss-network
    volumes:
      - ai-ml-models:/app/models
      - ai-ml-logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

