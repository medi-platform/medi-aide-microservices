version: '3.8'

services:
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile.pnpm
      args:
        SERVICE_NAME: notification-service
    container_name: stage3-notification-service
    environment:
      NODE_ENV: production
      SERVICE_NAME: notification-service
      SERVICE_VERSION: 1.0.0
      SERVICE_PORT: 4010
      DISABLE_CONSUL: "true"
      DISABLE_MQ: "true"
      DB_HOST: stage3-postgres
      DB_PORT: 5432
      DB_DATABASE: notification_db
      DB_USER: service_user
      DB_USERNAME: service_user
      DB_PASSWORD: service123
      REDIS_HOST: stage3-redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      TEMPORAL_ADDRESS: temporal:7233
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVICE_ROUTE_PREFIX: notifications
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      # Phase 4: Migration flags
      READ_SOURCE: micro
      DUAL_WRITE_ENABLED: "true"
      SECONDARY_API_BASE: http://host.docker.internal:3000
      MIGRATION_REQUEST_TIMEOUT_MS: 5000
      RECONCILIATION_ENABLED: "false"
    ports:
      - "4010:4010"
    healthcheck:
      # Use Node to avoid curl dependency in runtime image
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4010/ping',r=>{if(r.statusCode===200)process.exit(0);process.exit(1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - stage3-network
    depends_on:
      - stage3-postgres
      - stage3-redis

  auth-service:
