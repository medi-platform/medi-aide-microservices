##
# Docker Compose for Testing Environment
# Phase 7: Integration Testing
#
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   pnpm test:e2e
#   docker-compose -f docker-compose.test.yml down -v
##

version: '3.8'

services:
  # Test Database
  test-postgres:
    image: postgres:15-alpine
    container_name: medi-aide-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medi_aide_test
    ports:
      - '5433:5432'
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Test Redis
  test-redis:
    image: redis:7-alpine
    container_name: medi-aide-test-redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Test Kafka (optional for integration tests)
  test-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: medi-aide-test-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@test-kafka:9093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - '9093:9092'
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - test-network

  # Mailhog for email testing
  test-mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: medi-aide-test-mailhog
    ports:
      - '1026:1025'  # SMTP
      - '8026:8025'  # Web UI
    networks:
      - test-network

  # MinIO for S3 testing
  test-minio:
    image: minio/minio:latest
    container_name: medi-aide-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - test-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - test-network

volumes:
  test-postgres-data:
  test-minio-data:

networks:
  test-network:
    driver: bridge
