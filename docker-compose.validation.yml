# ============================================================================
# DOCKER COMPOSE - VALIDATION ENVIRONMENT
# ============================================================================
# This configuration runs all Stage 3 microservices in health-only mode
# for route validation testing. Services return health responses without
# requiring database connections.
#
# Usage:
#   docker-compose -f docker-compose.validation.yml up -d
#   ./scripts/validate-all-routes.sh http://localhost:8000
#   docker-compose -f docker-compose.validation.yml down
# ============================================================================

version: '3.8'

x-common-env: &common-env
  NODE_ENV: production
  HEALTH_ONLY: "true"
  DISABLE_DB: "true"
  DISABLE_KAFKA: "true"
  DISABLE_MQ: "true"
  DISABLE_GRPC: "true"
  DISABLE_CONSUL: "true"

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 10s

networks:
  validation-network:
    driver: bridge
    name: stage3-network

services:
  # ============================================================================
  # KONG API GATEWAY
  # ============================================================================
  kong:
    image: kong:3.4
    container_name: validation-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ./gateway:/kong/declarative:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - validation-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      <<: *healthcheck

  # ============================================================================
  # CORE SERVICES
  # ============================================================================
  auth-service:
    image: node:20-alpine
    container_name: stage3-auth-service
    working_dir: /app
    command: node -e "require('http').createServer((req,res)=>{res.writeHead(200,{'Content-Type':'application/json'});res.end(JSON.stringify({status:'ok',service:'auth-service'}))}).listen(4011)"
    environment:
      <<: *common-env
      SERVICE_PORT: 4011
    networks:
      validation-network:
        aliases:
          - stage3-auth-service
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:4011"]
      <<: *healthcheck

  user-service:
