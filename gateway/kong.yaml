  # =============================================================================
  # PHASE 1: LEGACY PATH ALIASES (Parity-safe, Strangler Fig friendly)
  # These routes reduce reliance on monolith-fallback by rewriting ONLY well-defined
  # legacy path patterns to their Stage 3 equivalents.
  #
  # Enterprise-grade principles:
  # - Collision-safe regex (never matches the newer plural routes like /agencies)
  # - High regex_priority so aliases win over monolith-fallback
  # - Boundary-aware matching so we don't accidentally catch similarly-named routes
  #   (e.g., /api/v1/caregiver-registration should NOT match the /api/v1/caregiver alias)
  # =============================================================================

  # Legacy: /api/v1/agency/*  -> Stage3: /api/v1/agencies/*
  - name: agency-service-legacy-alias
    url: http://stage3-agency-service:4050/api/v1/agencies
    routes:
      - name: agency-legacy-alias
        # Legacy singular prefix alias:
        # - /api/v1/agency/**  -> /api/v1/agencies/**
        # Collision-safe: will NOT match /api/v1/agencies/**.
        paths:
          - "~^/api/v1/agency(?=/|$)"
        strip_path: true
        regex_priority: 200
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS

  # Legacy: /api/v1/admin/** -> Stage3 admin-service: /admin/**
  - name: admin-service-legacy-alias
    url: http://stage3-admin-service:4036/admin
    routes:
      - name: admin-legacy-alias
        # Collision-safe: will NOT match routes like /api/v1/admin-analytics/**.
        paths:
          - "~^/api/v1/admin(?=/|$)"
        strip_path: true
        regex_priority: 200
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS

  # Legacy: /api/v1/caregiver/** -> Stage3: /api/v1/caregivers/**
  - name: caregiver-service-legacy-alias
    url: http://stage3-caregiver-service:4051/api/v1/caregivers
