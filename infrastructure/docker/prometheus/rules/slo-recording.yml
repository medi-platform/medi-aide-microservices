groups:
  - name: slo_recording
    interval: 30s
    rules:
      # Availability: 1 - 5xx / all
      - record: service:availability:ratio
        expr: 1 - (sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service))

      # Latency: P95 under threshold (0.5s)
      - record: service:latency_p95:seconds
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service))

      # Error rate
      - record: service:error_rate:ratio
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service)

      # SLI windows (rolling)
      - record: service:availability:burn_rate
        expr: (1 - service:availability:ratio) / 0.001  # target error 0.1%

      - record: service:latency:violations
        expr: service:latency_p95:seconds > 0.5
