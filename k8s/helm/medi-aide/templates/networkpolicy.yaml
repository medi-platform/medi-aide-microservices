---
# Specific policy for Kafka access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "medi-aide.fullname" . }}-kafka
  labels:
    {{- include "medi-aide.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "medi-aide.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9092
{{- end }}

