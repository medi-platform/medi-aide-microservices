{{- if not (lookup "v1" "Secret" .Release.Namespace "postgres-credentials") }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    {{- include "medi-aide.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: "{{ .Values.database.password | default "CHANGE_ME_IN_PRODUCTION" }}"
  username: "{{ .Values.database.username }}"
---
{{- end }}

{{- if not (lookup "v1" "Secret" .Release.Namespace "redis-credentials") }}
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  labels:
    {{- include "medi-aide.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: "{{ .Values.redis.password | default "CHANGE_ME_IN_PRODUCTION" }}"
---
{{- end }}

{{- if not (lookup "v1" "Secret" .Release.Namespace "auth-secrets") }}
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  labels:
    {{- include "medi-aide.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: "{{ .Values.auth.jwtSecret | default "CHANGE_ME_IN_PRODUCTION" }}"
  jwt-refresh-secret: "{{ .Values.auth.jwtRefreshSecret | default "CHANGE_ME_IN_PRODUCTION" }}"
---
{{- end }}

{{- if not (lookup "v1" "Secret" .Release.Namespace "payment-secrets") }}
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  labels:
    {{- include "medi-aide.labels" . | nindent 4 }}
type: Opaque
stringData:
  stripe-secret: "{{ .Values.payment.stripeSecret | default "CHANGE_ME_IN_PRODUCTION" }}"
---
{{- end }}

{{- if not (lookup "v1" "Secret" .Release.Namespace "service-auth-secrets") }}
apiVersion: v1
kind: Secret
metadata:
  name: service-auth-secrets
  labels:
    {{- include "medi-aide.labels" . | nindent 4 }}
type: Opaque
stringData:
  service-jwt-secret: "{{ .Values.serviceAuth.jwtSecret | default "CHANGE_ME_IN_PRODUCTION" }}"
---
{{- end }}

