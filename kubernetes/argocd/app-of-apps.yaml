apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medi-aide-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: medi-aide
  source:
    repoURL: https://github.com/medi-platform/medi-aide-monorepo.git
    targetRevision: HEAD
    path: kubernetes/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

