##############################################################################
# Common Configuration
# Phase 8: CI/CD Pipeline Enhancements
##############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: medi-aide
  labels:
    app.kubernetes.io/part-of: medi-aide
data:
  # Service discovery
  CONSUL_HOST: consul.medi-aide-infra.svc.cluster.local
  CONSUL_PORT: "8500"
  
  # Kafka
  KAFKA_BROKERS: kafka.medi-aide-infra.svc.cluster.local:9092
  
  # Redis
  REDIS_HOST: redis.medi-aide-infra.svc.cluster.local
  REDIS_PORT: "6379"
  
  # Database defaults
  DB_PORT: "5432"
  DB_SSL: "true"
  
  # Logging
  LOG_FORMAT: "json"
  LOG_LEVEL: "info"
  
  # Tracing
  JAEGER_ENDPOINT: http://jaeger-collector.observability.svc.cluster.local:14268/api/traces
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  
  # Feature flags
  FEATURE_FLAGS_ENABLED: "true"
  
  # CORS
  CORS_ORIGINS: "https://medi-aide.com,https://app.medi-aide.com,https://admin.medi-aide.com"
  
  # Rate limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
