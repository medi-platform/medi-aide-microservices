apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-config
  namespace: medi-aide
data:
  consul-config.json: |
    {
      "datacenter": "dc1",
      "data_dir": "/consul/data",
      "log_level": "INFO",
      "node_name": "consul-server",
      "server": true,
      "bootstrap_expect": 3,
      "encrypt": "{{ .Values.consul.encrypt }}",
      "retry_join": ["consul-0.consul", "consul-1.consul", "consul-2.consul"],
      "ui": true,
      "client_addr": "0.0.0.0",
      "ports": {
        "grpc": 8502
      },
      "connect": {
        "enabled": true
      },
      "enable_script_checks": false,
      "disable_remote_exec": true,
      "telemetry": {
        "prometheus_retention_time": "30s",
        "disable_hostname": true
      },
      "acl": {
        "enabled": false,
        "default_policy": "allow"
      },
      "performance": {
        "raft_multiplier": 1
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-scripts
  namespace: medi-aide
data:
  register-service.sh: |
    #!/bin/sh
    # Script to register service with Consul
    
    SERVICE_NAME=${SERVICE_NAME:-$1}
    SERVICE_PORT=${SERVICE_PORT:-$2}
    SERVICE_ID="${SERVICE_NAME}-${HOSTNAME}"
    
    # Wait for Consul to be ready
    until consul members; do
      echo "Waiting for Consul..."
      sleep 5
    done
    
    # Register service
    consul services register -name="$SERVICE_NAME" \
      -id="$SERVICE_ID" \
      -address="$POD_IP" \
      -port="$SERVICE_PORT" \
      -meta version="$SERVICE_VERSION" \
      -meta pod="$HOSTNAME" \
      -meta namespace="$POD_NAMESPACE" \
      -check-http="http://$POD_IP:$SERVICE_PORT/health" \
      -check-interval="10s" \
      -check-timeout="5s"
      
    echo "Service $SERVICE_NAME registered with ID $SERVICE_ID"
    
  deregister-service.sh: |
    #!/bin/sh
    # Script to deregister service from Consul
    
    SERVICE_NAME=${SERVICE_NAME:-$1}
    SERVICE_ID="${SERVICE_NAME}-${HOSTNAME}"
    
    # Deregister service
    consul services deregister -id="$SERVICE_ID"
    
    echo "Service $SERVICE_NAME deregistered (ID: $SERVICE_ID)"
    
  consul-template.hcl: |
    consul {
      address = "consul:8500"
      retry {
        enabled = true
        attempts = 10
        backoff = "250ms"
        max_backoff = "1m"
      }
    }
    
    template {
      source = "/consul-template/service-config.ctmpl"
      destination = "/config/service-config.json"
      command = "kill -HUP 1"
      wait {
        min = "2s"
        max = "10s"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-consul-sidecar
  namespace: medi-aide
data:
  consul-sidecar-config.yaml: |
    # Consul sidecar configuration for services
    consulSidecar:
      enabled: true
      image: hashicorp/consul:1.18
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"
      volumeMounts:
        - name: consul-config
          mountPath: /consul/config
        - name: consul-data
          mountPath: /consul/data
      env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      lifecycle:
        preStop:
          exec:
            command:
              - /bin/sh
              - -c
              - consul leave
