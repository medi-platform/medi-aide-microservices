apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: medi-aide
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: stage3
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: medi-aide
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: stage3
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: stage3
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: notification-service
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: ghcr.io/medi-aide/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4010
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: NODE_ENV
              value: "production"
            - name: DISABLE_DB
              value: "true"
            - name: PORT
              value: "4010"
            - name: SERVICE_NAME
              value: "notification-service"
            - name: SERVICE_ROUTE_PREFIX
              value: "notifications"
            - name: SERVICE_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CONSUL_HOST
              value: "consul.medi-aide.svc.cluster.local"
            - name: CONSUL_PORT
              value: "8500"
            - name: DISABLE_DB
              value: "true"
            - name: DISABLE_CONSUL
              value: "true"
            - name: DISABLE_MQ
              value: "true"
            - name: DISABLE_GRPC
              value: "true"
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: notification-service-db
                  key: host
                  optional: true
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: notification-service-db
                  key: port
                  optional: true
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: notification-service-db
                  key: user
                  optional: true
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-service-db
                  key: password
                  optional: true
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: notification-service-db
                  key: name
                  optional: true
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /notifications/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /notifications/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["notification-service"]
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
  namespace: medi-aide
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-service
  namespace: medi-aide
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-and-egress-notification-service
  namespace: medi-aide
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: medi-aide
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: medi-aide
      ports:
        - protocol: TCP
          port: 8500
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: medi-aide
  labels:
    app.kubernetes.io/name: notification-service
