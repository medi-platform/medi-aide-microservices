##############################################################################
# External Secrets Configuration
# Phase 8: CI/CD Pipeline Enhancements
#
# Uses External Secrets Operator to sync secrets from AWS Secrets Manager
##############################################################################

# ClusterSecretStore for AWS Secrets Manager
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ca-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets

# Common database secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-secrets
  namespace: medi-aide-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: database-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: medi-aide/prod/database
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: medi-aide/prod/database
        property: port
    - secretKey: DB_USER
      remoteRef:
        key: medi-aide/prod/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: medi-aide/prod/database
        property: password

