server {
  listen 80;
  server_name _;

  # Default to caregiver if shell is not deployed in this stack
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://caregiver:3000;
  }

  location /shell/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3011/;
  }

  location /caregiver/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3002/;
  }

  location /patient/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3013/;
  }

  location /wellness/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3004/;
  }

  location /admin/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3005/;
  }

  location /admin-enhanced/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3006/;
  }

  location /training/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3007/;
  }

  location /networking/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3008/;
  }

  location /analytics/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3009/;
  }

  location /compliance/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3010/;
  }

  location /mobile/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://host.docker.internal:3012/;
  }

  # CORS for remote entries for each MFE (optional convenience via Nginx)
  location = /caregiver/_next/static/chunks/remoteEntry.js { add_header Access-Control-Allow-Origin *; add_header Access-Control-Allow-Methods "GET, OPTIONS"; if ($request_method = 'OPTIONS') { return 204; } proxy_pass http://host.docker.internal:3002/_next/static/chunks/remoteEntry.js; }
  location = /patient/_next/static/chunks/remoteEntry.js   { add_header Access-Control-Allow-Origin *; add_header Access-Control-Allow-Methods "GET, OPTIONS"; if ($request_method = 'OPTIONS') { return 204; } proxy_pass http://host.docker.internal:3013/_next/static/chunks/remoteEntry.js; }
  location = /wellness/_next/static/chunks/remoteEntry.js  { add_header Access-Control-Allow-Origin *; add_header Access-Control-Allow-Methods "GET, OPTIONS"; if ($request_method = 'OPTIONS') { return 204; } proxy_pass http://host.docker.internal:3004/_next/static/chunks/remoteEntry.js; }
  location = /admin/_next/static/chunks/remoteEntry.js     { add_header Access-Control-Allow-Origin *; add_header Access-Control-Allow-Methods "GET, OPTIONS"; if ($request_method = 'OPTIONS') { return 204; } proxy_pass http://host.docker.internal:3005/_next/static/chunks/remoteEntry.js; }
  location = /admin-enhanced/_next/static/chunks/remoteEntry.js { add_header Access-Control-Allow-Origin *; add_header Access-Control-Allow-Methods "GET, OPTIONS"; if ($request_method = 'OPTIONS') { return 204; } proxy_pass http://host.docker.internal:3006/_next/static/chunks/remoteEntry.js; }
  location = /training/_next/static/chunks/remoteEntry.js  { add_header Access-Control-Allow-Origin *; add_header Access-Control-Allow-Methods "GET, OPTIONS"; if ($request_method = 'OPTIONS') { return 204; } proxy_pass http://host.docker.internal:3007/_next/static/chunks/remoteEntry.js; }
  location = /networking/_next/static/chunks/remoteEntry.js{ add_header Access-Control-Allow-Origin *; add_header Access-Control-Allow-Methods "GET, OPTIONS"; if ($request_method = 'OPTIONS') { return 204; } proxy_pass http://host.docker.internal:3008/_next/static/chunks/remoteEntry.js; }
  location = /analytics/_next/static/chunks/remoteEntry.js { add_header Access-Control-Allow-Origin *; add_header Access-Control-Allow-Methods "GET, OPTIONS"; if ($request_method = 'OPTIONS') { return 204; } proxy_pass http://host.docker.internal:3009/_next/static/chunks/remoteEntry.js; }
  location = /compliance/_next/static/chunks/remoteEntry.js{ add_header Access-Control-Allow-Origin *; add_header Access-Control-Allow-Methods "GET, OPTIONS"; if ($request_method = 'OPTIONS') { return 204; } proxy_pass http://host.docker.internal:3010/_next/static/chunks/remoteEntry.js; }
  location = /mobile/_next/static/chunks/remoteEntry.js    { add_header Access-Control-Allow-Origin *; add_header Access-Control-Allow-Methods "GET, OPTIONS"; if ($request_method = 'OPTIONS') { return 204; } proxy_pass http://host.docker.internal:3012/_next/static/chunks/remoteEntry.js; }
}


