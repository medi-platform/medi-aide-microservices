##############################################################################
# Enhanced AlertManager Configuration
# Phase 10: Observability
##############################################################################

global:
  smtp_smarthost: 'smtp.medi-aide.com:587'
  smtp_from: 'alerts@medi-aide.com'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Route tree
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts - PagerDuty + Slack
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    # Security alerts - Security team
    - match:
        team: security
      receiver: 'security-alerts'
      group_wait: 15s
      repeat_interval: 30m

    # HIPAA compliance alerts
    - match:
        compliance: hipaa
      receiver: 'compliance-alerts'
      group_wait: 10s
      repeat_interval: 15m

    # Business alerts - Business team
    - match:
        team: business
      receiver: 'business-alerts'
      group_wait: 1m
      repeat_interval: 2h

    # Warning alerts - Slack only
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 2h

    # Info alerts - Low priority
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 12h

# Inhibition rules
inhibit_rules:
  # If service is down, don't alert about other issues
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['service']

  # If database is down, suppress query alerts
  - source_match:
      alertname: 'PostgreSQLDown'
    target_match:
      alertname: 'DatabaseSlowQueries'

  # If Redis is down, suppress cache alerts
  - source_match:
      alertname: 'RedisDown'
    target_match:
      alertname: 'LowCacheHitRate'

# Receivers
receivers:
  - name: 'default-receiver'
    slack_configs:
      - channel: '#medi-aide-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: 'critical-alerts'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ template "pagerduty.description" . }}'
        severity: critical
    slack_configs:
      - channel: '#medi-aide-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.text" . }}'
        color: 'danger'
    email_configs:
      - to: 'oncall@medi-aide.com'
        send_resolved: true

  - name: 'security-alerts'
    slack_configs:
      - channel: '#security-alerts'
        send_resolved: true
        title: '🔒 Security Alert: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.text" . }}'
        color: 'warning'
    email_configs:
      - to: 'security@medi-aide.com'
        send_resolved: true

  - name: 'compliance-alerts'
    slack_configs:
      - channel: '#compliance-alerts'
        send_resolved: true
        title: '📋 HIPAA Compliance: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.text" . }}'
        color: 'warning'
    email_configs:
      - to: 'compliance@medi-aide.com'
        send_resolved: true

  - name: 'business-alerts'
    slack_configs:
      - channel: '#business-ops'
        send_resolved: true
        title: '📊 Business Alert: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.text" . }}'

  - name: 'warning-alerts'
    slack_configs:
      - channel: '#medi-aide-alerts'
        send_resolved: true
        title: '⚠️ Warning: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.text" . }}'
        color: 'warning'

  - name: 'info-alerts'
    slack_configs:
      - channel: '#medi-aide-info'
        send_resolved: false
        title: 'ℹ️ Info: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.text" . }}'

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'
