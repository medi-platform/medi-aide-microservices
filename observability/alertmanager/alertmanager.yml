global:
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@medi-aide.com'
  smtp_auth_username: 'alerts@medi-aide.com'
  smtp_auth_password: '${SMTP_PASSWORD}'

  # Slack webhook for notifications
  slack_api_url: '${SLACK_WEBHOOK_URL}'

  # PagerDuty integration
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Route tree
route:
  # Default receiver
  receiver: 'default-receiver'
  
  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'service']
  
  # Wait before sending initial notification
  group_wait: 30s
  
  # Wait before sending subsequent notifications
  group_interval: 5m
  
  # Wait before repeating notification
  repeat_interval: 4h

  # Child routes
  routes:
    # Critical alerts go to PagerDuty
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true

    # HIPAA violations need immediate attention
    - match:
        alertname: HIPAAViolationDetected
      receiver: 'hipaa-team'
      group_wait: 0s
      repeat_interval: 15m

    # Compliance alerts
    - match:
        team: compliance
      receiver: 'compliance-team'

    # Platform team alerts
    - match:
        team: platform
      receiver: 'platform-team'

    # Care team alerts
    - match:
        team: care
      receiver: 'care-team'

# Receivers
receivers:
  - name: 'default-receiver'
    slack_configs:
      - channel: '#alerts-general'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          alertname: '{{ .GroupLabels.alertname }}'

  - name: 'hipaa-team'
    email_configs:
      - to: 'hipaa-compliance@medi-aide.com'
        subject: '🚨 HIPAA ALERT: {{ .GroupLabels.alertname }}'
        html: |
          <h2>HIPAA Compliance Alert</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          {{ range .Alerts }}
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Runbook:</strong> <a href="{{ .Annotations.runbook_url }}">{{ .Annotations.runbook_url }}</a></p>
          {{ end }}
    slack_configs:
      - channel: '#hipaa-alerts'
        title: '🚨 HIPAA ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: '#FF0000'

  - name: 'compliance-team'
    slack_configs:
      - channel: '#compliance-alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: '{{ if eq .Status "firing" }}#FF0000{{ else }}#00FF00{{ end }}'
        send_resolved: true

  - name: 'platform-team'
    slack_configs:
      - channel: '#platform-alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'care-team'
    slack_configs:
      - channel: '#care-alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

# Inhibition rules
inhibit_rules:
  # If a critical alert is firing, suppress warnings for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # If the service is down, suppress all other alerts for that service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['service']

