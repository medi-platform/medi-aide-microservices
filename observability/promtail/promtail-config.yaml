server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>stage3-.+?)\.
          source: tag
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # MediAide service logs (structured JSON)
  - job_name: medi-aide-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: medi-aide
          __path__: /var/log/medi-aide/*/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            service: service
            traceId: traceId
            spanId: spanId
            userId: userId
            requestId: requestId
            duration: duration
            statusCode: statusCode
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: message

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<program>\S+?)(?:\[(?P<pid>\d+)\])?:\s+(?P<message>.*)$'
      - labels:
          hostname:
          program:
      - timestamp:
          source: timestamp
          format: Jan 2 15:04:05
      - output:
          source: message

