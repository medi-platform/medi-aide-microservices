name: Trivy Container Scan

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
      - name: Build images
        run: |
          for svc in services/*; do
            NAME=$(basename "$svc")
            docker build -t "$NAME:test" "$svc" || true
          done
      - name: Scan images
        run: |
          for svc in services/*; do
            NAME=$(basename "$svc")
            trivy image --exit-code 0 --severity HIGH,CRITICAL "$NAME:test" || true
          done
