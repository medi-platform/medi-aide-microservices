networks:
  stage3-network:
    external: true
    name: stage3-network

volumes:
  stage3-prometheus-data:
  stage3-grafana-data:

services:
  stage3-jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: stage3-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    networks:
      - stage3-network

  stage3-prometheus:
    image: prom/prometheus:v2.45.0
    container_name: stage3-prometheus
    volumes:
      - ./infrastructure/docker/prometheus:/etc/prometheus
      - stage3-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - stage3-network

  stage3-grafana:
    image: grafana/grafana:10.0.0
    container_name: stage3-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning
      - stage3-grafana-data:/var/lib/grafana
    ports:
      - "3006:3000"
    networks:
      - stage3-network


