networks:
  stage3-network:
    external: true
    name: stage3-network

services:
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: stage3-notification-service
    environment:
      - NODE_ENV=development
      - PORT=4010
      - SERVICE_NAME=notification-service
      - SERVICE_ADDRESS=host.docker.internal
      - SERVICE_ROUTE_PREFIX=notifications
      - DB_HOST=stage3-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=notification_db
      - RABBITMQ_URL=amqp://admin:admin@stage3-rabbitmq:5672
      - CONSUL_HOST=stage3-consul
      - CONSUL_PORT=8500
    ports:
      - "4010:4010"
    depends_on:
      - stage3-postgres
      - stage3-rabbitmq
    networks:
      - stage3-network

  auth-service:
    build:
