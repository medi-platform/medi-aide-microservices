      - SERVICE_ADDRESS=host.docker.internal
      - DB_HOST=stage3-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=auth_db
      - JWT_SECRET=dev-secret
      - CONSUL_HOST=stage3-consul
      - CONSUL_PORT=8500
