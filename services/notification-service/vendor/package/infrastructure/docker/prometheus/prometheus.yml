global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules
rule_files:
  - /etc/prometheus/alerts/*.yml
  - /etc/prometheus/rules/*.yml

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Add alertmanager endpoint when deployed

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'jaeger'
    metrics_path: /metrics
    static_configs:
      - targets: ['stage3-jaeger:14269']

  # Existing services
  - job_name: 'notification-service'
    metrics_path: /notifications/metrics
    static_configs:
      - targets: ['stage3-notification-service:4010']

  - job_name: 'auth-service'
    metrics_path: /auth/metrics
    static_configs:
      - targets: ['stage3-auth-service:4011']

  - job_name: 'user-service'
    metrics_path: /users/metrics
    static_configs:
      - targets: ['stage3-user-service:4012']

  - job_name: 'visit-service'
    metrics_path: /visits/metrics
    static_configs:
      - targets: ['stage3-visit-service:4013']

  - job_name: 'wellness-service'
    metrics_path: /wellness/metrics
    static_configs:
      - targets: ['stage3-wellness-service:4014']

  - job_name: 'payment-service'
    metrics_path: /payments/metrics
    static_configs:
      - targets: ['stage3-payment-service:4015']

  # New services
  - job_name: 'analytics-service'
    metrics_path: /analytics/metrics
    static_configs:
      - targets: ['stage3-analytics-service:4016']

  - job_name: 'audit-service'
    metrics_path: /audit/metrics
    static_configs:
      - targets: ['stage3-audit-service:4017']

  - job_name: 'ai-service'
    metrics_path: /ai/metrics
    static_configs:
      - targets: ['stage3-ai-service:4018']

  - job_name: 'care-plan-service'
    metrics_path: /care-plans/metrics
    static_configs:
      - targets: ['stage3-care-plan-service:4019']

  - job_name: 'evv-service'
    metrics_path: /evv/metrics
    static_configs:
      - targets: ['stage3-evv-service:4020']

  - job_name: 'file-service'
    metrics_path: /files/metrics
    static_configs:
      - targets: ['stage3-file-service:4021']

  - job_name: 'search-service'
    metrics_path: /search/metrics
    static_configs:
      - targets: ['stage3-search-service:4022']

  - job_name: 'matching-service'
    metrics_path: /matching/metrics
    static_configs:
      - targets: ['stage3-matching-service:4023']

  - job_name: 'training-service'
    metrics_path: /training/metrics
    static_configs:
      - targets: ['stage3-training-service:4024']

  - job_name: 'feedback-service'
    metrics_path: /feedback/metrics
    static_configs:
      - targets: ['stage3-feedback-service:4025']

  - job_name: 'communication-service'
    metrics_path: /communication/metrics
    static_configs:
      - targets: ['stage3-communication-service:4026']


