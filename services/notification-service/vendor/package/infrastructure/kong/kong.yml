          - /api/communication
        strip_path: true

plugins:
  # Global rate limiting
  - name: rate-limiting
    config:
      minute: 60
      policy: local
  
  # Request correlation ID
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
  
  # Prometheus metrics
  - name: prometheus
  
  # Request/response transformer for security headers
  - name: response-transformer
    config:
      add:
        headers:
          - X-Frame-Options:DENY
          - X-Content-Type-Options:nosniff
          - X-XSS-Protection:1; mode=block
