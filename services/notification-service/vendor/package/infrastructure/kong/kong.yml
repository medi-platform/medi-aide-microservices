_format_version: "3.0"
_transform: true

services:
  # Notification Service
  - name: notification-service
    url: http://notification-service:4010
    routes:
      - name: notification-route
        paths:
          - /api/notifications
        strip_path: true
    
  # Auth Service
  - name: auth-service
