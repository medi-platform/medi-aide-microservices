apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medi-aide-services
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: medi-aide
  source:
    repoURL: https://github.com/medi-aide/medi-aide-monorepo
    targetRevision: main
    path: kubernetes/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: medi-aide-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  info:
    - name: 'Team'
      value: 'Platform Engineering'
    - name: 'Stage'
      value: 'Three'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: medi-aide
  namespace: argocd
spec:
  description: Medi-Aide Stage 3 Services
  sourceRepos:
  - 'https://github.com/medi-aide/*'
  destinations:
  - namespace: 'medi-aide-*'
    server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRole
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRoleBinding
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  roles:
  - name: admin
    policies:
    - p, proj:medi-aide:admin, applications, *, medi-aide/*, allow
    - p, proj:medi-aide:admin, repositories, *, *, allow
    groups:
    - platform-team
  - name: readonly
    policies:
    - p, proj:medi-aide:readonly, applications, get, medi-aide/*, allow
    groups:
    - developers
