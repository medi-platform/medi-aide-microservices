apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-config
  namespace: medi-aide
  labels:
    app.kubernetes.io/name: consul
    app.kubernetes.io/part-of: stage3
data:
  CONSUL_HOST: "consul.medi-aide.svc.cluster.local"
  CONSUL_PORT: "8500"
  CONSUL_SECURE: "false"
  CONSUL_DEREGISTER_AFTER: "60s"
  CONSUL_CHECK_INTERVAL: "15s"
  CONSUL_CHECK_TIMEOUT: "10s"
