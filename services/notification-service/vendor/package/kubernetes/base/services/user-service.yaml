apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: medi-aide
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: stage3
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: stage3
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-service
          image: REPLACE_ME_REGISTRY/medi-aide-user-service:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4012
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4012"
            - name: SERVICE_NAME
              value: "user-service"
            - name: SERVICE_ROUTE_PREFIX
              value: "users"
            - name: SERVICE_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CONSUL_HOST
              value: "consul.medi-aide.svc.cluster.local"
            - name: CONSUL_PORT
              value: "8500"
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: user-service-db
                  key: host
                  optional: true
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: user-service-db
                  key: port
                  optional: true
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: user-service-db
                  key: user
                  optional: true
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-db
                  key: password
                  optional: true
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: user-service-db
                  key: name
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /users/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /users/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: medi-aide
  labels:
    app.kubernetes.io/name: user-service
spec:
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service
  namespace: medi-aide
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service
  namespace: medi-aide
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-and-ingress-user-service
  namespace: medi-aide
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: user-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: medi-aide
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: medi-aide
      ports:
        - protocol: TCP
          port: 8500
        - protocol: TCP
          port: 5432


