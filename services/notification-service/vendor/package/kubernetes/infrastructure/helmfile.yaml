repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: hashicorp
    url: https://helm.releases.hashicorp.com
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: kong
    url: https://charts.konghq.com
  - name: jaegertracing
    url: https://jaegertracing.github.io/helm-charts
  - name: elastic
    url: https://helm.elastic.co

helmDefaults:
  wait: true
  timeout: 600
  recreatePods: false
  force: false

environments:
  development:
    values:
      - environments/development/values.yaml
  staging:
    values:
      - environments/staging/values.yaml
  production:
    values:
      - environments/production/values.yaml

releases:
  # PostgreSQL Database
  - name: postgres
    namespace: medi-aide
    chart: bitnami/postgresql
    version: 13.2.24
    values:
      - values/postgres.yaml
    set:
      - name: auth.postgresPassword
        value: {{ requiredEnv "POSTGRES_PASSWORD" }}

  # Redis Cache
  - name: redis
    namespace: medi-aide
    chart: bitnami/redis
    version: 18.6.1
    values:
      - values/redis.yaml
    set:
      - name: auth.password
        value: {{ requiredEnv "REDIS_PASSWORD" }}

  # RabbitMQ Message Queue
  - name: rabbitmq
    namespace: medi-aide
    chart: bitnami/rabbitmq
    version: 12.5.6
    values:
      - values/rabbitmq.yaml
    set:
      - name: auth.password
        value: {{ requiredEnv "RABBITMQ_PASSWORD" }}

  # Consul Service Discovery
  - name: consul
    namespace: medi-aide
    chart: hashicorp/consul
    version: 1.3.1
    values:
      - values/consul.yaml

  # Kong API Gateway
  - name: kong
    namespace: medi-aide
    chart: kong/kong
    version: 2.35.0
    values:
      - values/kong.yaml
    needs:
      - consul

  # Prometheus Monitoring
  - name: prometheus
    namespace: monitoring
    chart: prometheus-community/kube-prometheus-stack
    version: 55.5.0
    values:
      - values/prometheus.yaml
    set:
      - name: grafana.adminPassword
        value: {{ requiredEnv "GRAFANA_PASSWORD" }}

  # Jaeger Tracing
  - name: jaeger
    namespace: monitoring
    chart: jaegertracing/jaeger
    version: 0.71.14
    values:
      - values/jaeger.yaml
    needs:
      - prometheus

  # Elasticsearch for Search Service
  - name: elasticsearch
    namespace: medi-aide
    chart: elastic/elasticsearch
    version: 8.5.1
    values:
      - values/elasticsearch.yaml
    condition: elasticsearch.enabled

  # Loki for Log Aggregation
  - name: loki
    namespace: monitoring
    chart: grafana/loki-stack
    version: 2.9.11
    values:
      - values/loki.yaml
    needs:
      - prometheus
