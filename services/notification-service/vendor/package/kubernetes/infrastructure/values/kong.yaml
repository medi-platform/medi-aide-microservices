# Kong API Gateway values for Medi-Aide Stage 3
image:
  repository: kong
  tag: "3.5"

env:
  database: "off"  # Using DB-less mode with declarative config
  nginx_worker_processes: "4"
  proxy_access_log: /dev/stdout
  admin_access_log: /dev/stdout
  admin_error_log: /dev/stderr
  proxy_error_log: /dev/stderr
  prefix: /kong_prefix/

proxy:
  enabled: true
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  http:
    enabled: true
    servicePort: 80
    containerPort: 8000
  tls:
    enabled: true
    servicePort: 443
    containerPort: 8443

admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001
    containerPort: 8001

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# Enable Prometheus metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: true

# DB-less configuration
dblessConfig:
  config: |
    _format_version: "3.0"
    services:
      # Auth Service
      - name: auth-service
        url: http://auth-service.medi-aide.svc.cluster.local:4011
        routes:
          - name: auth-route
            paths:
              - /api/auth
            strip_path: true
      
      # User Service
      - name: user-service
        url: http://user-service.medi-aide.svc.cluster.local:4012
        routes:
          - name: user-route
            paths:
              - /api/users
            strip_path: true
      
      # Visit Service
      - name: visit-service
        url: http://visit-service.medi-aide.svc.cluster.local:4013
        routes:
          - name: visit-route
            paths:
              - /api/visits
            strip_path: true
      
      # Add remaining services...
    
    plugins:
      - name: prometheus
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid
      - name: rate-limiting
        config:
          minute: 60
          policy: local
