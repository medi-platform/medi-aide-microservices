# PostgreSQL values for Medi-Aide Stage 3
global:
  postgresql:
    auth:
      database: medi_aide_db
      
architecture: replication
replication:
  enabled: true
  slaveReplicas: 2
  synchronousCommit: "on"
  numSynchronousReplicas: 1

primary:
  persistence:
    enabled: true
    size: 100Gi
    storageClass: gp3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  nodeSelector:
    workload-type: database
  tolerations:
    - key: database-only
      operator: Equal
      value: "true"
      effect: NoSchedule

readReplicas:
  persistence:
    enabled: true
    size: 100Gi
    storageClass: gp3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring

backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 30
